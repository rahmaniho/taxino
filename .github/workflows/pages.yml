name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build brand assets (AVIF/WebP sets, fonts, icons)
        run: npm run assets

      - name: Quality gate (types, build, structure/SEO/axe, API, lead layer)
        run: |
          set -o pipefail
          npm run qa 2>&1 | tee qa-report.txt

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: qa-report.txt
          if-no-files-found: warn

      - name: Production build for the custom subdomain
        run: npm run build
        env:
          VITE_BASE: /
          PUBLIC_SITE_URL: https://taxino.karen-soft.ir

      - name: Point crawler files at the custom domain
        run: |
          sed -i "s|https://www.taxino.ir|https://taxino.karen-soft.ir|g" dist/sitemap.xml dist/robots.txt

      - name: Create clean URL directory for demo page
        run: |
          mkdir -p dist/demo && cp dist/demo.html dist/demo/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
